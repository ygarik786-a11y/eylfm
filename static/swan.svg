<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe9b8"/>
      <stop offset=".55" stop-color="#ffb877"/>
      <stop offset="1" stop-color="#ff8f6b"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6f97cc"/>
      <stop offset="1" stop-color="#3c5a8f"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe27a"/>
      <stop offset="1" stop-color="#f0a81c"/>
    </linearGradient>
    <clipPath id="frame"><rect x="2" y="2" width="116" height="116" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect x="2" y="2" width="116" height="116" fill="url(#sky)"/>
    <circle cx="90" cy="28" r="21" fill="#fff3c4" opacity=".35"/>
    <circle cx="90" cy="28" r="12" fill="#fff3c4" opacity=".9"/>
    <!-- лебедь -->
    <g>
      <!-- шея -->
      <path d="M88,68 C97,55 96,42 87,32" fill="none" stroke="#ffffff" stroke-width="11" stroke-linecap="round"/>
      <path d="M82,66 C89,54 88,43 81,34" fill="none" stroke="#dde6ef" stroke-width="3.5" stroke-linecap="round" opacity=".85"/>
      <!-- тело -->
      <path d="M18,86 C12,76 20,64 36,61 C54,57.5 74,58 88,64 C98,68.5 100,77 94,84 C88,91 70,95 52,94 C34,93 23,93 18,86 Z" fill="#ffffff" stroke="#cfd9e4" stroke-width="1"/>
      <!-- крыло -->
      <path d="M30,75 C40,64 58,61 73,66 C63,70 59,77 61,83 C48,85 36,83 30,75 Z" fill="#e6edf4"/>
      <path d="M36,76 C44,69 56,66 66,68" fill="none" stroke="#bccfe0" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M40,81 C47,75 57,72 65,74" fill="none" stroke="#bccfe0" stroke-width="1.8" stroke-linecap="round"/>
      <!-- голова -->
      <circle cx="86" cy="29" r="7.6" fill="#ffffff"/>
      <!-- корона -->
      <g transform="translate(76.5,12.5) rotate(-8)">
        <path d="M0,11 L2.5,2.5 L7,8 L11,-0.5 L15,8 L19.5,2.5 L22,11 Z" fill="url(#gold)" stroke="#c8890a" stroke-width=".9" stroke-linejoin="round"/>
        <circle cx="11" cy="6.5" r="1.5" fill="#e63950"/>
        <circle cx="4.5" cy="8" r="1.1" fill="#ffffff"/>
        <circle cx="17.5" cy="8" r="1.1" fill="#ffffff"/>
      </g>
      <!-- чёрный нарост и маска немого лебедя -->
      <circle cx="91.5" cy="25.5" r="2.7" fill="#20242a"/>
      <path d="M89,24.5 L96,28.5 L89.5,31.5 C88,29 88,26.5 89,24.5 Z" fill="#20242a"/>
      <!-- клюв -->
      <path d="M93,26.5 L106,30.5 L93,34.5 C95,31.5 95,29 93,26.5 Z" fill="#f58a1f" stroke="#d96f06" stroke-width=".6" stroke-linejoin="round"/>
      <path d="M102.5,29.3 L106,30.5 L102.8,32.2 C103.4,31.2 103.4,30.2 102.5,29.3 Z" fill="#20242a"/>
      <!-- глаз -->
      <circle cx="87.5" cy="28.5" r="1.4" fill="#1a1a1a"/>
    </g>
    <!-- вода поверх низа тела -->
    <rect x="2" y="87" width="116" height="33" fill="url(#water)" opacity=".94"/>
    <ellipse cx="56" cy="89" rx="40" ry="3.2" fill="#ffffff" opacity=".28"/>
    <path d="M14,99 h18 M44,106 h24 M82,100 h20 M24,112 h16" stroke="#dceaff" stroke-width="2" stroke-linecap="round" opacity=".55"/>
    <!-- блики -->
    <path d="M28,18 l1.8,4.2 4.2,1.8 -4.2,1.8 -1.8,4.2 -1.8,-4.2 -4.2,-1.8 4.2,-1.8 Z" fill="#ffffff" opacity=".85"/>
    <path d="M104,58 l1.3,3 3,1.3 -3,1.3 -1.3,3 -1.3,-3 -3,-1.3 3,-1.3 Z" fill="#ffffff" opacity=".7"/>
  </g>
  <rect x="2" y="2" width="116" height="116" rx="24" fill="none" stroke="#e8a04c" stroke-width="2.5"/>
</svg>
