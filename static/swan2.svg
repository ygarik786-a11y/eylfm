    <g transform="translate(84.5,8.5) rotate(-8)">
      <path d="M0,12 L2.5,3 L7,9 L11,0 L15,9 L19.5,3 L22,12 Z" fill="url(#gold)" stroke="#c8890a" stroke-width=".9" stroke-linejoin="round"/>
      <rect x="0" y="12" width="22" height="2.8" rx="1.4" fill="url(#gold)" stroke="#c8890a" stroke-width=".7"/>
      <circle cx="11" cy="7" r="1.6" fill="#e63950"/>
      <circle cx="4.5" cy="9" r="1.15" fill="#ffffff"/>
      <circle cx="17.5" cy="9" r="1.15" fill="#ffffff"/>
    </g>
    <!-- чёрный нарост и маска -->
    <circle cx="97.3" cy="23.6" r="2.3" fill="#20242a"/>
    <path d="M95.8,23.2 L100.3,26.6 L96.2,30.4 C95,28 95,25.4 95.8,23.2 Z" fill="#20242a"/>
    <!-- клюв -->
    <path d="M97.8,24.6 C102.8,24.9 106.8,27.2 108.3,29.8 C105.3,31 101,31.5 98,31 C99.2,29 99.2,26.7 97.8,24.6 Z" fill="url(#beakG)" stroke="#d96f06" stroke-width=".6" stroke-linejoin="round"/>
    <path d="M105.4,28.2 L108.3,29.8 L105.6,31.5 C106.2,30.4 106.2,29.2 105.4,28.2 Z" fill="#20242a"/>
    <!-- глаз -->
    <circle cx="94.3" cy="26.8" r="1.35" fill="#1a1a1a"/>
    <circle cx="94.7" cy="26.4" r=".45" fill="#ffffff"/>
    <!-- вода -->
    <rect x="2" y="87" width="116" height="33" fill="url(#water)" opacity=".94"/>
    <ellipse cx="54" cy="89.5" rx="41" ry="3.4" fill="#ffffff" opacity=".3"/>
    <path d="M14,99 h18 M44,106 h24 M82,100 h20 M24,112 h16" stroke="#dceaff" stroke-width="2" stroke-linecap="round" opacity=".55"/>
    <!-- блики -->
    <path d="M24,15 l1.8,4.2 4.2,1.8 -4.2,1.8 -1.8,4.2 -1.8,-4.2 -4.2,-1.8 4.2,-1.8 Z" fill="#ffffff" opacity=".85"/>
    <path d="M109,50 l1.3,3 3,1.3 -3,1.3 -1.3,3 -1.3,-3 -3,-1.3 3,-1.3 Z" fill="#ffffff" opacity=".7"/>
