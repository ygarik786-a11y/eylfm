<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe9b8"/>
      <stop offset=".55" stop-color="#ffb877"/>
      <stop offset="1" stop-color="#ff8f6b"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6f97cc"/>
      <stop offset="1" stop-color="#3c5a8f"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe27a"/>
      <stop offset="1" stop-color="#f0a81c"/>
    </linearGradient>
    <linearGradient id="bodyG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dbe5ef"/>
    </linearGradient>
    <linearGradient id="beakG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffa53a"/>
      <stop offset="1" stop-color="#f07d0e"/>
    </linearGradient>
    <clipPath id="frame"><rect x="2" y="2" width="116" height="116" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect x="2" y="2" width="116" height="116" fill="url(#sky)"/>
    <circle cx="104" cy="18" r="17" fill="#fff3c4" opacity=".35"/>
    <circle cx="104" cy="18" r="9" fill="#fff3c4" opacity=".9"/>
    <!-- лебедь: единый силуэт — тело, шея и голова одним контуром -->
    <path d="M11,63 C18,54 34,49.5 54,49.5 C68,49.5 79,52 84,44 C87,39.5 88.3,33 88.6,28.5 C88.8,24 92,21.3 95.6,21.8 C99.3,22.3 101,25.8 100,29.8 C98.6,35.5 97.8,42 98.6,48.5 C99.3,54 101.5,58.5 102.8,64 C104.5,71.5 101.5,79.5 93.5,84.5 C83,90 64,92 47,91 C31,90 19,84.5 14.5,75.5 C11.8,70.5 10.6,66.8 11,63 Z" fill="url(#bodyG)" stroke="#bfcfdd" stroke-width="1"/>
    <!-- мягкая тень по горлу -->
    <path d="M95.8,33 C94.6,40 94.2,47 95.2,54" fill="none" stroke="#d5dfea" stroke-width="2" stroke-linecap="round" opacity=".65"/>
    <!-- приподнятое крыло-парус -->
    <path d="M27,62 C33,48.5 50,42 65.5,46.5 C57.5,50.5 55,57 57,64 C47,68 33,67.5 27,62 Z" fill="#f4f8fb" stroke="#ccd8e3" stroke-width=".8"/>
    <path d="M34.5,58.5 C40.5,50.5 50.5,47 58.5,49" fill="none" stroke="#d5dfe9" stroke-width="1.6" stroke-linecap="round"/>
    <!-- крыло с рядами перьев -->
    <path d="M25.5,72.5 C35.5,60 56.5,54.5 75.5,60 C67,64 63,70.5 65,78 C50.5,84 33.5,82.5 25.5,72.5 Z" fill="#edf2f7"/>
    <path d="M31.5,70.5 q4.5,-5 9,0 q4.5,-5 9,0 q4.5,-5 9,0 q4.5,-5 9,0" fill="none" stroke="#bfcfe0" stroke-width="1.7" stroke-linecap="round"/>
    <path d="M34.5,78 q4.5,-5 9,0 q4.5,-5 9,0 q4.5,-5 9,0" fill="none" stroke="#bfcfe0" stroke-width="1.7" stroke-linecap="round"/>
    <path d="M40.5,66 q4,-4.5 8,0 q4,-4.5 8,0 q4,-4.5 8,0" fill="none" stroke="#c9d6e3" stroke-width="1.5" stroke-linecap="round"/>
